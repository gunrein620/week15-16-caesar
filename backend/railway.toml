[build]
builder = "NIXPACKS"
buildCommand = "pip install uv && uv sync --frozen"

[deploy]
startCommand = "uv run alembic upgrade head && uv run python -m app.cli seed-demo && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
