[project]
name = "week15-16-caesar-backend"
version = "0.1.0"
description = "RESCENE fan community backend with RAG, MCP, and Agent features"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.17.2",
  "bcrypt<5",
  "email-validator>=2.3.0",
  "fastapi>=0.124.0",
  "httpx>=0.28.1",
  "langchain>=1.1.3",
  "langgraph>=1.0.4",
  "mcp>=1.25.0",
  "openai>=2.9.0",
  "passlib[bcrypt]>=1.7.4",
  "pgvector>=0.4.1",
  "psycopg[binary]>=3.3.2",
  "pydantic-settings>=2.12.0",
  "python-jose[cryptography]>=3.5.0",
  "python-multipart>=0.0.20",
  "slowapi>=0.1.9",
  "sqlalchemy>=2.0.45",
  "typer>=0.20.0",
  "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "ruff>=0.14.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
