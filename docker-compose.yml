services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: caesar
      POSTGRES_PASSWORD: caesar
      POSTGRES_DB: caesar
    ports:
      - "5432:5432"
    volumes:
      - caesar-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caesar -d caesar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caesar-postgres:
